<!DOCTYPE html>  <html>    <head>    
<title>Maths 2 Papers</title>    
<meta name="viewport" content="width=device-width, initial-scale=1.0">  <style>    
body{

}    header{

</style>  </head>  <body>  <header>Maths 2 – Mid Examination Papers</header>  <div id="userEmail"></div>  <!-- MID 1 -->  <div class="paper-card">

Download PDF
</button>

</div>
    
<script type="module">  import { initializeApp } from  
"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";  import {
getAuth,
onAuthStateChanged,
setPersistence,
browserLocalPersistence,
signOut
} from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
apiKey: "AIzaSyB6xwUMfwDPrPfHol4I0-gfsYzDuld5rIM",
authDomain: "madhukar-speaks.firebaseapp.com",
projectId: "madhukar-speaks",
storageBucket: "madhukar-speaks.firebasestorage.app",
messagingSenderId: "675959256381",
appId: "1:675959256381:web:a42776eed4683d7d324154",
measurementId: "G-HJ774ZZ4Q1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const loginTime = localStorage.getItem("loginTime");
const sevenDays = 7 * 24 * 60 * 60 * 1000;
if (
!loginTime ||
Date.now() - Number(loginTime) > sevenDays
){

signOut(auth);

localStorage.removeItem("loginTime");

window.location.href =
"login.html?redirect=maths2.html";

}
// 🔐 Permanent login on this device
setPersistence(auth, browserLocalPersistence);

// 👤 Show logged-in email
onAuthStateChanged(auth,(user)=>{
    if(user){

        document.getElementById("userEmail").innerText =
        "Logged in as: " + user.email;

        const pendingPdf = localStorage.getItem("pendingPdf");

        if(pendingPdf){
            localStorage.removeItem("pendingPdf");
            window.open(pendingPdf,"_blank");
        }

    }
});
    
// ⬇ Download Logic
window.handleDownload = function(file){

    if(auth.currentUser){

        window.open(file,"_blank");

    }else{

        localStorage.setItem("pendingPdf", file);

        window.location.href="login.html?redirect=maths2.html";

    }

}

</script>  </body>

</html>
