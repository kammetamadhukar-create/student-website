<!DOCTYPE html>
<html>
<head>
<title>Physics</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Segoe UI,sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
color:white;
text-align:center;
}

header{
padding:25px;
font-size:24px;
font-weight:bold;
}

.paper-card{
max-width:700px;
margin:40px auto;
padding:30px;
border-radius:20px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(12px);
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.thumb{
width:95%;
border-radius:12px;
margin-top:15px;
box-shadow:0 10px 25px rgba(0,0,0,0.3);
animation:fadeIn .4s ease;
}

@keyframes fadeIn{
from{
opacity:0;
transform:scale(.98);
}
to{
opacity:1;
transform:scale(1);
}
}

button{
margin-top:18px;
padding:12px 30px;
border:none;
border-radius:25px;
background:#facc15;
font-weight:bold;
cursor:pointer;
transition:.3s;
}

button:hover{
transform:scale(1.05);
}

#userEmail{
margin-top:10px;
font-size:14px;
opacity:.8;
}
</style>
</head>

<body>

<header>– Phy Mid Papers</header>

<div id="userEmail"></div>
<div class="paper-card">

<h2>Mid 1 Imp Q's & Answers</h2>

<button onclick="handleDownload('https://drive.google.com/drive/folders/169isY6B3et4mUDpPuKTAD2gL-mNmCZK_')">
Download Mid 1 PDF
</button>

</div>


<div class="paper-card">

<h2>Mid 2 Q's & answers</h2>


<button onclick="handleDownload('https://drive.google.com/drive/folders/11_KSQWTCga2VO4y0BS9M9mIv3O96XOT7')">
Download Mid 2 PDF
</button>

</div>


<div class="paper-card">

<h2>Question Bank</h2>


<button onclick="handleDownload('https://drive.google.com/drive/folders/1SoHMnvQb65YrYD3u70VA_G_rZ2HtchTP')">
Download PDF
</button>

</div>

<script type="module">
  


import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";


const firebaseConfig = {
  apiKey: "AIzaSyB6xwUMfwDPrPfHol4I0-gfsYzDuld5rIM",
  authDomain: "madhukar-speaks.firebaseapp.com",
  projectId: "madhukar-speaks",
  storageBucket: "madhukar-speaks.firebasestorage.app",
  messagingSenderId: "675959256381",
  appId: "1:675959256381:web:a42776eed4683d7d324154",
  measurementId: "G-HJ774ZZ4Q1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);

// 7 Days Login Check
const loginTime = localStorage.getItem("loginTime");
const sevenDays = 7 * 24 * 60 * 60 * 1000;

if (
  loginTime &&
  Date.now() - Number(loginTime) > sevenDays
) {
  signOut(auth);

  localStorage.removeItem("loginTime");

  window.location.href =
  "login.html?redirect=phy.html";
}

// Keep Login On Device
setPersistence(
  auth,
  browserLocalPersistence
);

// Show Logged In Email
onAuthStateChanged(auth, (user) => {

  if (user) {

    document.getElementById("userEmail")
    .innerText =
    "Logged in as: " + user.email;

  } else {

    window.location.href =
    "login.html?redirect=phy.html";

  }

});

// Download Protection
window.handleDownload = function(file){
if(auth.currentUser){
window.open(file,"_blank");
}else{
window.location.href="login.html?redirect=phy.html";
}
}
</script>

</body>
</html>


</script>

</body>
</html>
