<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Madhukar Speaks</title>

<style>

/* =====================
   GLOBAL
===================== */

*{
margin:0;
padding:0;
box-sizing:border-box;
}

html{
scroll-behavior:smooth;
}

body{
font-family:Segoe UI,sans-serif;
background:
linear-gradient(
135deg,
#0f172a,
#1e3a8a,
#3b82f6
);
color:white;
overflow-x:hidden;
}

/* =====================
   NAVBAR
===================== */

nav{
position:fixed;
top:0;
left:0;
width:100%;
display:flex;
justify-content:center;
align-items:center;
gap:30px;
padding:18px;

background:
rgba(0,0,0,0.35);

backdrop-filter:blur(12px);

z-index:1000;
}

nav a{
text-decoration:none;
color:white;
font-weight:600;
transition:.3s;
}

nav a:hover{
color:#facc15;
}

/* =====================
   HERO
===================== */

.hero{
min-height:100vh;

display:flex;
flex-direction:column;

justify-content:center;
align-items:center;

text-align:center;

padding:20px;
}

.hero h1{

font-size:52px;

max-width:900px;

line-height:1.2;

margin-bottom:20px;
}

.hero p{

font-size:18px;

max-width:650px;

line-height:1.7;

opacity:.9;

margin-bottom:30px;
}

.btn{

padding:14px 34px;

border:none;

border-radius:50px;

background:#facc15;

font-weight:bold;

cursor:pointer;

transition:.3s;
}

.btn:hover{
transform:scale(1.08);
}

/* =====================
   COMMON SECTION
===================== */

section{
padding:120px 20px;
text-align:center;
}

h2{
margin-bottom:20px;
font-size:38px;
}

/* =====================
   FADE ANIMATION
===================== */

.fade{
opacity:0;
transform:translateY(50px);
transition:.8s ease;
}

.fade.show{
opacity:1;
transform:translateY(0);
}

/* =====================
   VALUE GRID
===================== */

.value-grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:25px;

max-width:1100px;

margin:auto;
}

.value-box{

background:
rgba(255,255,255,.12);

padding:35px;

border-radius:20px;

backdrop-filter:blur(10px);

transition:.3s;
}

.value-box:hover{
transform:translateY(-8px);
}

/* =====================
   SUBJECT GRID
===================== */

.subject-grid{

display:grid;

grid-template-columns:
repeat(3,1fr);

gap:25px;

max-width:1100px;

margin:auto;
}

.subject{

background:
rgba(255,255,255,.12);

padding:30px;

border-radius:20px;

cursor:pointer;

transition:.3s;
}

.subject:hover{
transform:translateY(-10px);
}
/* =====================
   MENTOR SECTION
===================== */

.mentor{

max-width:850px;

margin:auto;

background:
rgba(255,255,255,.12);

padding:45px;

border-radius:25px;

backdrop-filter:blur(10px);
}

.mentor img{

width:120px;
height:120px;

border-radius:50%;

margin-bottom:20px;
}

.mentor h3{
font-size:32px;
margin-bottom:15px;
}

.mentor p{

line-height:1.8;

opacity:.9;
}

/* =====================
   FAQ
===================== */

.faq{

max-width:900px;

margin:auto;

background:
rgba(255,255,255,.12);

padding:50px;

border-radius:25px;

text-align:left;

backdrop-filter:blur(10px);
}

.faq-item{
margin-top:25px;
}

.faq-item h4{

margin-bottom:10px;

font-size:20px;
}

.faq-item p{

opacity:.9;

line-height:1.8;
}

/* =====================
   APP SECTION
===================== */

.app-section{

max-width:900px;

margin:auto;

padding:60px;

border-radius:30px;

background:
linear-gradient(
135deg,
#1e3a8a,
#2563eb
);
}

.app-section h2{
margin-bottom:20px;
}

/* =====================
   FOOTER
===================== */

footer{

margin-top:100px;

background:
rgba(0,0,0,.5);

padding:40px;

text-align:center;
}

footer p{
margin-top:10px;
}

footer a{

color:#facc15;

text-decoration:none;
}

/* =====================
   MOBILE
===================== */

@media(max-width:768px){

.hero h1{
font-size:34px;
}

.hero p{
font-size:16px;
}

.value-grid,
.subject-grid{
grid-template-columns:1fr;
}

nav{
gap:15px;
font-size:14px;
}

h2{
font-size:30px;
}

}

</style>
</head>

<body>

<nav>

<a href="#">Home</a>

<a href="#subjects">
Subjects
</a>

<a href="#faq">
FAQ
</a>

<a href="#contact">
Contact
</a>

</nav>

<!-- HERO -->

<section class="hero">

<h1>
Learn Engineering Subjects with Clarity
</h1>

<p>
Structured study materials designed
for real exam performance.
</p>

<button
class="btn"
onclick="
document.getElementById('subjects')
.scrollIntoView()">

Start Learning

</button>

</section>
