<!DOCTYPE html>
<html>
<head>
<title>Electronic Devices & Circuits</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body{
margin:0;
font-family:Segoe UI, sans-serif;
background:linear-gradient(135deg,#0f172a,#1e293b,#2563eb);
color:white;
text-align:center;
}

header{
padding:25px;
font-size:24px;
font-weight:bold;
letter-spacing:1px;
}

.paper-card{
max-width:750px;
margin:40px auto;
padding:30px;
border-radius:20px;
background:rgba(255,255,255,0.1);
backdrop-filter:blur(12px);
box-shadow:0 10px 25px rgba(0,0,0,0.3);
}

.paper-card h2{
margin-bottom:10px;
}

iframe{
width:95%;
height:420px;
border-radius:12px;
margin-top:15px;
border:none;
}

button{
margin-top:18px;
padding:12px 30px;
border:none;
border-radius:25px;
background:#facc15;
font-weight:bold;
cursor:pointer;
transition:0.3s;
}

button:hover{
transform:scale(1.05);
}

#userEmail{
margin-top:10px;
font-size:14px;
opacity:0.8;
}
</style>
</head>

<body>

<header>Electronic Devices & Circuits – Mid Papers</header>

<div id="userEmail"></div>

<!-- MID 1 -->
  <div class="paper-card">

<h2>Mid 1 Imp Q's & answers</h2>

<button onclick="handleDownload('https://drive.google.com/drive/folders/1Q1T9dczi1N7LJBqTcryyuCrcdWwoMVSN')">
Download Mid 1
</button>

</div>

<div class="paper-card">

<h2>Mid 2 Imp Q's & answers</h2>

<button onclick="handleDownload('https://drive.google.com/drive/folders/1sPk9D2kxjd0AMHH9Z2NWSf_k_oV_iPJg')">
Download Mid 2
</button>

</div>

<div class="paper-card">

<h2>Question Bank</h2>

<button onclick="handleDownload('https://drive.google.com/drive/folders/1xtjTVeqhidE5EK7SocUc-FEkSoh2soLl')">
Download PDF
</button>

</div>

<script type="module">

import { initializeApp } from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";

import {
  getAuth,
  onAuthStateChanged,
  setPersistence,
  browserLocalPersistence,
  signOut
} from
"https://www.gstatic.com/firebasejs/10.12.0/firebase-auth.js";

const firebaseConfig = {
  apiKey: "AIzaSyB6xwUMfwDPrPfHol4I0-gfsYzDuld5rIM",
  authDomain: "madhukar-speaks.firebaseapp.com",
  projectId: "madhukar-speaks",
  storageBucket: "madhukar-speaks.firebasestorage.app",
  messagingSenderId: "675959256381",
  appId: "1:675959256381:web:a42776eed4683d7d324154",
  measurementId: "G-HJ774ZZ4Q1"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const loginTime = localStorage.getItem("loginTime");
const sevenDays = 7 * 24 * 60 * 60 * 1000;
if (
  loginTime &&
  Date.now() - Number(loginTime) > sevenDays
) {

  signOut(auth);

  localStorage.removeItem("loginTime");

  window.location.href =
  "login.html?redirect=edc.html";
}
// Permanent login on device
setPersistence(auth, browserLocalPersistence);

// Show logged-in email
onAuthStateChanged(auth, (user) => {

    if (user) {

        document.getElementById("userEmail").innerText =
        "Logged in as: " + user.email;

        const pendingPdf = localStorage.getItem("pendingPdf");

        if (pendingPdf) {
            localStorage.removeItem("pendingPdf");
            window.open(pendingPdf, "_blank");
        }

    }

});

// Download protection
window.handleDownload = function(file){

    if(auth.currentUser){

        window.open(file, "_blank");

    }else{

        localStorage.setItem("pendingPdf", file);

        window.location.href =
        "login.html?redirect=edc.html";

    }

}

</script>

</body>
</html>
